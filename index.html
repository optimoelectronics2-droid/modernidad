<script>
/* Minimal bootstrap to handle legacy window.storage API */
if (typeof window.storage === 'undefined') {
  window.storage = {
    _data: {},
    get: function(key, cb) {
      try {
        const val = localStorage.getItem('sigr:' + key);
        return cb !== false ? { value: val } : Promise.resolve({ value: val });
      } catch(e) { return cb !== false ? { value: null } : Promise.resolve({ value: null }); }
    },
    set: function(key, val, cb) {
      try { localStorage.setItem('sigr:' + key, val); } catch(e) {}
      if (cb !== false) return;
      return Promise.resolve();
    }
  };
}
</script>
