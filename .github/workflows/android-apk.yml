name: Build BrayNotas APK

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Inyectar secreto de Google (js/secret.js)
        env:
          WEB_CLIENT_SECRET: ${{ secrets.WEB_CLIENT_SECRET }}
        run: |
          if [ -n "$WEB_CLIENT_SECRET" ]; then
            mkdir -p www/js
            echo "window.SIGR = window.SIGR || {};" > www/js/secret.js
            echo "window.SIGR.WEB_CLIENT_SECRET = '$WEB_CLIENT_SECRET';" >> www/js/secret.js
          else
            echo "::warning::Secret WEB_CLIENT_SECRET no definido - login Google nativo no funcionara"
          fi

      - name: Sync Capacitor (copia www -> android nativo)
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrayNotas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error